services:
  - type: web
    name: pr-review-agent
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn pr_review_agent.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: REVIEW_MODEL
        value: llama-3.3-70b-versatile
      - key: SUMMARY_MODEL
        value: llama-3.1-8b-instant
      - key: MAX_FILES_TO_REVIEW
        value: 10
      - key: MAX_FILE_SIZE_KB
        value: 100
      - key: REVIEW_TIMEOUT_MS
        value: 30000
      - key: MAX_PATCH_CHARS
        value: 12000
      - key: MAX_FILE_CONTEXT_CHARS
        value: 8000
      - key: MAX_COMMENTS_PER_REVIEW
        value: 20
      - key: REVIEW_SIMPLE_CHANGES
        value: false
      - key: POST_REVIEW_SUMMARY
        value: true
      - key: REQUEST_PARALLELISM
        value: 3
      - key: LOG_LEVEL
        value: INFO
