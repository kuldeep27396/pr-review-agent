[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-review-agent"
version = "2.0.0"
description = "Pure Python GitHub PR review agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "httpx>=0.28.0,<1.0.0",
  "PyJWT[crypto]>=2.10.0,<3.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
]

[project.scripts]
pr-review-agent = "pr_review_agent.main:run"

[tool.setuptools.packages.find]
include = ["pr_review_agent*"]
